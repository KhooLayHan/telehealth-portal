name: CD — Infrastructure (Pulumi)

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: true
    outputs:
      frontend-bucket:
        value: ${{ jobs.deploy-infra.outputs.frontend-bucket }}
      artifacts-bucket:
        value: ${{ jobs.deploy-infra.outputs.artifacts-bucket }}
      eb-app-name:
        value: ${{ jobs.deploy-infra.outputs.eb-app-name }}
      eb-env-name:
        value: ${{ jobs.deploy-infra.outputs.eb-env-name }}
      ecr-url:
        value: ${{ jobs.deploy-infra.outputs.ecr-url }}
      lambda-function-name:
        value: ${{ jobs.deploy-infra.outputs.lambda-function-name }}
      reminder-lambda-name:
        value: ${{ jobs.deploy-infra.outputs.reminder-lambda-name }}
      notifications-lambda-name:
        value: ${{ jobs.deploy-infra.outputs.notifications-lambda-name }}
      admin-analytics-lambda-name:
        value: ${{ jobs.deploy-infra.outputs.admin-analytics-lambda-name }}

jobs:
  deploy-infra:
    name: Pulumi — Provision Infrastructure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      frontend-bucket:      ${{ steps.pulumi.outputs.FrontendBucketName }}
      artifacts-bucket:     ${{ steps.pulumi.outputs.S3ArtifactsBucket }}
      eb-app-name:          ${{ steps.pulumi.outputs.EbAppName }}
      eb-env-name:          ${{ steps.pulumi.outputs.EbEnvName }}
      ecr-url:              ${{ steps.pulumi.outputs.EcrRepositoryUrl }}
      lambda-function-name: ${{ steps.pulumi.outputs.LambdaFunctionName }}
      reminder-lambda-name:        ${{ steps.pulumi.outputs.ReminderLambdaName }}
      notifications-lambda-name:   ${{ steps.pulumi.outputs.NotificationsLambdaName }}
      admin-analytics-lambda-name: ${{ steps.pulumi.outputs.AdminAnalyticsLambdaName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup .NET (required by Pulumi C# program)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Delete the conflicting RDS snapshot so the pending telehealth-db deletion
      # can proceed. This step is idempotent — once the RDS instance is gone this
      # snapshot will no longer exist and the step becomes a no-op.
      - name: Remove conflicting RDS snapshot (if present)
        run: |
          if aws rds describe-db-snapshots \
              --db-snapshot-identifier telehealth-db-prod-final \
              --region ${{ inputs.aws-region }} \
              --query 'DBSnapshots[0].DBSnapshotIdentifier' \
              --output text 2>/dev/null | grep -q "telehealth-db-prod-final"; then
            echo "Deleting conflicting snapshot telehealth-db-prod-final..."
            aws rds delete-db-snapshot \
              --db-snapshot-identifier telehealth-db-prod-final \
              --region ${{ inputs.aws-region }}
            aws rds wait db-snapshot-deleted \
              --db-snapshot-identifier telehealth-db-prod-final \
              --region ${{ inputs.aws-region }}
            echo "Snapshot deleted."
          else
            echo "Snapshot telehealth-db-prod-final not found — nothing to do."
          fi

      - name: Pulumi up
        uses: pulumi/actions@v6
        id: pulumi
        with:
          command: up
          stack-name: prod
          work-dir: infra
          upsert: true
          refresh: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
